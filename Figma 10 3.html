<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Schedule Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Poiret+One&family=Roboto+Slab:400,700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: linear-gradient(135deg,#d98fb0,#f08c7f);
    --card:#f6e8ee;
    --muted:#9b6f78;
    --accent:#b5a79b;
    --pill:#c2d091;
    font-family: 'Roboto Slab', serif;
  }
  body{
    margin:0;
    min-height:100vh;
    background:var(--bg);
    color:#2b1b1f;
  }
  .container{
    max-width:1100px;
    margin:24px auto;
    padding:20px;
  }


  header{
    display:flex;
    align-items:center;
    gap:14px;
    background:rgba(80,20,90,0.9);
    color:white;
    padding:18px 22px;
    border-radius:6px;
  }
  .avatar{
    width:56px;height:56px;border-radius:50%;
    background:rgba(255,255,255,0.3);
    display:flex;align-items:center;justify-content:center;font-weight:700;
    font-family:'Poiret One', cursive;
  }
  header h1{ margin:0;font-size:26px; font-family:'Poiret One', cursive;}


  .layout{
    display:grid;
    grid-template-columns: 300px 1fr;
    gap:18px;
    margin-top:18px;
  }


  .left{
    display:flex;flex-direction:column;gap:14px;
  }
  .reminder, .teacher, .notes{
    background:var(--card);
    padding:16px;border-radius:26px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.5);
  }
  .reminder h3{margin:0 0 8px 0;color:var(--muted)}
  .small-green{
    display:inline-block;background:var(--pill);padding:6px 10px;border-radius:999px;
    font-size:13px;color:#fff;
  }
  .notes textarea{
    width:100%;height:140px;border-radius:8px;border:1px solid #e1ced4;padding:8px;
    resize:none;font-family:inherit;
  }


  .right{
    display:flex;flex-direction:column;gap:18px;
  }
  .schedule-card, .week-card{
    background:var(--card);
    padding:18px;border-radius:26px;
  }
  .schedule-card h2, .week-card h2{
    margin:0 0 10px 0;font-family:'Poiret One', cursive;color:#fff;
    text-shadow: -1px -1px 0 rgba(0,0,0,0.2);
  }
  .grid{
    display:grid;
    grid-template-columns: 70px repeat(6,1fr);
    gap:1px;
    background:#b67f87;
    border-radius:14px;
    overflow:hidden;
  }
  .grid .cell{
    padding:14px;background: rgba(255,255,255,0.9); text-align:center;
    min-height:48px;font-size:15px;
  }
  .grid .row-title{ background:transparent; font-weight:700; color:#2b1b1f; }
  .dot{
    display:inline-block;width:42px;height:18px;border-radius:18px;background:#b6a39a;margin:6px auto;
  }


  .week-grid{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:12px;
  }
  .mini-cal{
    background:transparent;padding:12px;border-radius:12px;
  }
  .mini-table{
    border-radius:12px; overflow:hidden;background:rgba(255,255,255,0.92);
    display:grid; grid-template-columns: repeat(7,1fr); gap:1px;
  }
  .mini-table div{ padding:14px; min-height:46px; text-align:center; font-size:14px; background:white; }


  @media(max-width:880px){
    .layout{ grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
  <div class="container">
    <header>
      <div class="avatar">A</div>
      <h1>Name, subject</h1>
    </header>


    <div class="layout">
      <div class="left">
        <div class="reminder">
          <h3>Reminder:</h3>
          <p style="margin:6px 0 0 0;color:var(--muted)">Your next class is in <strong>30 minutes</strong></p>
        </div>


        <div class="teacher">
          <h4 style="margin:0 0 10px 0;color:#58343a">Teacher A</h4>
          <span class="small-green">I'm free during Friday</span>
        </div>


        <div class="notes">
          <textarea placeholder="Text..."></textarea>
        </div>
      </div>


      <div class="right">
        <div class="schedule-card">
          <h2 style="color:#fff">Your schedule for this week:</h2>
          <div class="grid" aria-hidden="true">
            <div class="cell row-title">Fri</div>
            <div class="cell">10A</div>
            <div class="cell">10B</div>
            <div class="cell">6A</div>
            <div class="cell">9B</div>
            <div class="cell">4C</div>
            <div class="cell">8D</div>


            <div class="cell"><strong>10 am</strong></div>
            <div class="cell"><span class="dot"></span></div>
            <div class="cell"><span class="dot"></span></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>


            <div class="cell"><strong>11 am</strong></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"><span class="dot"></span></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>


            <div class="cell"><strong>12am</strong></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"><span class="dot"></span></div>
            <div class="cell"></div>


            <div class="cell"><strong>1pm</strong></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"><span class="dot"></span></div>
            <div class="cell"></div>
            <div class="cell"><span class="dot"></span></div>
          </div>
        </div>


        <div class="week-card">
          <h2 style="color:#fff">Dec 1-7</h2>
          <div class="week-grid">
            <div class="mini-cal">
              <div style="margin-bottom:8px"><strong>3pm</strong></div>
              <div class="mini-table" style="grid-template-columns: 60px repeat(6,1fr);">
                <div style="background:transparent;padding:6px;border-right:0"></div>
                <div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sun</div>


                <div style="background:transparent;padding:6px"></div>
                <div colspan="1" style="padding:10px">10A</div><div></div><div></div><div></div><div></div><div></div>


                <div style="background:transparent;padding:6px"></div>
                <div style="padding:10px">4pm</div><div></div><div>10B</div><div></div><div></div><div></div>
              </div>
            </div>
            <div style="display:flex;align-items:center;justify-content:center;color:rgba(0,0,0,0.45);font-size:18px">Set time ✎</div>
          </div>
        </div>


      </div>
    </div>
  </div>
</body>
</html>
